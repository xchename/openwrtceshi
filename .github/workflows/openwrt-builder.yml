name: Build LEDE / OpenWrt Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev \
            libz-dev patch python3 python3-distutils unzip zlib1g-dev lib32gcc-s1 \
            libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip \
            p7zip-full msmtp libssl-dev

      # 3. 克隆 LEDE / OpenWrt 源码
      - name: Clone LEDE source
        run: |
          git clone https://github.com/coolsnowwolf/lede.git lede
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 应用预置 .config
      - name: Apply pre-configured .config
        run: |
          cp .config lede/.config
          cd lede
          make defconfig

      # 5. 修改默认 LAN IP
      - name: Modify default IP
        run: |
          cd lede
          sed -i "s/192\.168\.1\.1/192.168.5.1/g" package/base-files/files/bin/config_generate

      # 6. 编译固件
      - name: Build firmware
        run: |
          cd lede
          make -j$(nproc) || make V=s

      # 7. 上传编译产物到 Artifact
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDE-Firmware
          path: lede/bin/targets/

      # 8. 创建 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-${{ github.run_number }}
          name: LEDE Build ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 上传固件到 Release
      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-${{ github.run_number }}
          files: lede/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
