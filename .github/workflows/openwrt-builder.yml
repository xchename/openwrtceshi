name: Build LEDE / OpenWrt Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装依赖
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext \
            genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev \
            libreadline-dev libssl-dev libtool llvm lrzsz libnsl-dev ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion \
            swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev

      # 3. 克隆 LEDE / OpenWrt 源码
      - name: Clone LEDE source
        run: |
          git clone https://github.com/coolsnowwolf/lede
          cd lede
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 4. 应用预置 .config
      - name: Apply pre-configured .config
        run: |
          cp .config lede/.config
          cd lede
          make defconfig

      # 5. 修改默认 LAN IP
      - name: Modify default IP
        run: |
          cd lede
          sed -i "s/192\.168\.1\.1/192.168.5.1/g" package/base-files/files/bin/config_generate

      # 6. 编译固件
      - name: Build firmware
        run: |
          cd lede
          make -j$(nproc) || make V=s

      # 7. 上传编译产物到 Artifact
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDE-Firmware
          path: lede/bin/targets/

      # 8. 创建 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-${{ github.run_number }}
          name: LEDE Build ${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. 上传固件到 Release
      - name: Upload firmware to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-${{ github.run_number }}
          files: lede/bin/targets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
