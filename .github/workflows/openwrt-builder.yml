name: Build OpenWrt Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential asciidoc binutils bzip2 gawk gettext git libncurses5-dev \
          libz-dev patch python3 python3-distutils unzip zlib1g-dev lib32gcc-s1 \
          libc6-dev-i386 subversion flex uglifyjs gcc-multilib g++-multilib p7zip \
          p7zip-full msmtp libssl-dev

    - name: Clone LEDE source
      run: |
        git clone https://github.com/coolsnowwolf/lede.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply custom config
      run: |
        cp .config openwrt/.config
        cd openwrt
        make defconfig

    - name: Modify default IP
      run: |
        cd openwrt
        sed -i "s/192.168.1.1/192.168.5.1/g" package/base-files/files/bin/config_generate

    - name: Compile firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      with:
        name: OpenWrt-firmware
        path: openwrt/bin/targets/

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: openwrt-${{ github.run_number }}
        name: OpenWrt Build ${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload assets to Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: openwrt-${{ github.run_number }}
        files: openwrt/bin/targets/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
